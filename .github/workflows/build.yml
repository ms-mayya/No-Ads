name: Build & Deploy Rule Sets

on:
  push:
    branches: [main]
    paths:
      - rules.yaml
      - build.cs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Build rule sets
        run: dotnet run build.cs

      - name: Push dist/ to release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/release-repo"
          git clone --branch release --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/release-repo"

          cp -a dist/. "$RUNNER_TEMP/release-repo/"

          cd "$RUNNER_TEMP/release-repo"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: auto-build $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin release
