name: Convert AdGuard filters to SRS

on:
  schedule:
    - cron: "0 20 * * *" # daily 04:00 UTC+8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch-push
  cancel-in-progress: false

env:
  FILTERS: |
    filter_1
    filter_21
  HAGEZI_LISTS: |
    light=https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/light.txt
    normal=https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/multi.txt
    pro=https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
    pro.plus=https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.plus.txt
    ultimate=https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/ultimate.txt
    tif=https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.txt
    blocklist=https://raw.githubusercontent.com/ppfeufer/adguard-filter-list/refs/heads/master/blocklist

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 1

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          gh release download "$tag" --repo SagerNet/sing-box \
            --pattern 'sing-box-*-linux-amd64.tar.gz'
          tar -xzf sing-box-*-linux-amd64.tar.gz
          sudo install -m 755 sing-box-*-linux-amd64/sing-box /usr/local/bin/sing-box
          rm -rf sing-box-*-linux-amd64*
          sing-box version

      - name: Convert rule sets
        run: |
          set -euo pipefail
          mkdir -p sing-box

          # Existing HostlistsRegistry lists
          for name in $FILTERS; do
            echo "converting $name"
            curl -fsSL \
              "https://adguardteam.github.io/HostlistsRegistry/assets/${name}.txt" \
              -o "${name}.txt"
            sing-box rule-set convert --type adguard \
              --output "sing-box/${name}.srs" \
              "${name}.txt"
          done

          # HaGeZi AdGuard lists
          while IFS='=' read -r name url; do
            [ -z "${name}" ] && continue
            echo "converting ${name}"
            curl -fsSL "${url}" -o "${name}.txt"
            sing-box rule-set convert --type adguard \
              --output "sing-box/${name}.srs" \
              "${name}.txt"
          done <<< "$HAGEZI_LISTS"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sing-box/*.srs
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update srs $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin release
